<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#efe8da">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Foldwork">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Foldwork">
  <!-- The web app manifest and home-screen icons are added at startup (src/ui/appManifest.js): the icons are drawn in code, so there are no files to link here. -->
  <meta name="description" content="Foldwork: fold the paper dungeon floor to solve puzzles and defeat enemies.">
  <title>Foldwork</title>
  <!-- Link preview when the address is shared. og:image must be a full address, so it names the live site (change it if the game moves). share.png is drawn by tools/share-image.html; the game never loads it. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Foldwork">
  <meta property="og:title" content="Foldwork">
  <meta property="og:description" content="A free paper-folding roguelike for the browser: fold the dungeon floor to solve puzzles and beat enemies. No installs, no ads.">
  <meta property="og:url" content="https://avatar-coco-love.github.io/foldwork/">
  <meta property="og:image" content="https://avatar-coco-love.github.io/foldwork/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Foldwork: a paper dungeon board mid-fold, its right edge lifting over a dashed crease, next to the title and a Play button">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Favicon drawn in code (no file): a sheet with a folded corner and a dashed crease. -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e9e2d3'/%3E%3Cpath d='M7 5h12l6 6v16H7z' fill='%23fbf8f1' stroke='%233a3229' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M19 5v6h6z' fill='%23d9734e' stroke='%233a3229' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 19h18' stroke='%23d9734e' stroke-width='2' stroke-dasharray='3 2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="board" aria-label="Game board"></canvas>
  <div id="ui"></div>
  <noscript><p class="noscript">Foldwork needs JavaScript enabled.</p></noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
